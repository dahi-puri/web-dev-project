<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="tic-tac-toe.css">
</head>
<body>
    <main class="game-card">
        <header class="game-header">
            <p class="eyebrow">MINI GAME</p>
            <h1>Tic Tac Toe</h1>
            <p class="subtitle">A little game of Xs and Os</p>
        </header>

        <section class="scoreboard" aria-label="Player scores">
            <div class="score active-player">
                <span class="player-symbol x-symbol">X</span>
                <span class="player-name">Player X</span>
                <strong>1</strong>
            </div>
            <div class="score">
                <span class="player-symbol o-symbol">O</span>
                <span class="player-name">Player O</span>
                <strong>0</strong>
            </div>
        </section>

        <section class="board" aria-label="Tic Tac Toe board">
            <div class="cell x-symbol">X</div>
            <div class="cell o-symbol">O</div>
            <div class="cell x-symbol">X</div>
            <div class="cell o-symbol">O</div>
            <div class="cell x-symbol winning-cell">X</div>
            <div class="cell"> </div>
            <div class="cell o-symbol">O</div>
            <div class="cell"> </div>
            <div class="cell x-symbol winning-cell">X</div>
        </section>

        <p class="status"><span class="status-dot"></span> Player X's turn</p>
        <div class="game-actions">
            <button type="button" class="primary-button">New Game</button>
            <button type="button" class="secondary-button">Reset Score</button>
        </div>
        <footer>Take turns. Get three in a row to win!</footer>
    </main>
</body>
</html>
